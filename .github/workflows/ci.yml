name: GitHub Action Pipeline
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout repository
      uses: actions/checkout@v4
    - name: Display message
      run: echo "Build Started"
    - name: List files
      run: ls -la
    - name: Build Succesfull
      run: echo "Build completed successfully"
